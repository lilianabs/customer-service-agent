[project]
name = "customer-service-assistant"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
notebook = [
    "boto3>=1.44.4",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "langchain-text-splitters>=1.1.3",
    "nbconvert>=7.17.2",
    "numpy>=2.5.5",
    "opensearch-py>=3.2.0",
    "pandas>=3.1.1",
    "rank-bm25>=0.2.2",
]

[tool.uv.workspace]
members = [
    "services/mcp-server",
    "services/agents",
]

[tool.pyright]
extraPaths = ["services/agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/agents"]
markers = [
    "live: calls Amazon Bedrock (needs AWS credentials); deselect with -m 'not live'",
]
